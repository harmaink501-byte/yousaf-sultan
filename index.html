<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YOUSAF SULTAN</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#080808;
    color:white;
}

header{
    position:sticky;
    top:0;
    z-index:100;
    background:#111;
    padding:18px 12px;
    text-align:center;
    border-bottom:1px solid #333;
}

header h1{
    color:#ffd700;
    font-size:28px;
}

header p{
    color:#aaa;
    margin-top:5px;
}

.container{
    width:94%;
    max-width:1100px;
    margin:auto;
}

.search{
    margin:20px 0;
}

.search input{
    width:100%;
    padding:15px;
    border-radius:12px;
    border:1px solid #444;
    background:#171717;
    color:white;
    font-size:16px;
}

.section-title{
    margin:25px 0 15px;
    color:#ffd700;
}

.billionaires{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:14px;
}

.person{
    background:#151515;
    border:1px solid #333;
    border-radius:15px;
    padding:18px;
    cursor:pointer;
    transition:.2s;
}

.person:hover{
    transform:translateY(-3px);
    border-color:#ffd700;
}

.person h3{
    margin-bottom:8px;
}

.person .money{
    color:#5cff7a;
    font-weight:bold;
}

#fortune{
    scroll-margin-top:90px;
    margin-top:30px;
}

.fortune-box{
    background:linear-gradient(135deg,#151515,#222);
    border:1px solid #444;
    border-radius:18px;
    padding:22px;
}

.balance{
    font-size:30px;
    color:#5cff7a;
    font-weight:bold;
    margin:10px 0;
    word-break:break-word;
}

.progress-bg{
    height:15px;
    background:#333;
    border-radius:20px;
    overflow:hidden;
    margin:12px 0;
}

.progress{
    height:100%;
    width:0%;
    background:#ffd700;
    transition:.3s;
}

.history{
    margin-top:15px;
    max-height:180px;
    overflow:auto;
}

.history div{
    padding:8px 0;
    border-bottom:1px solid #292929;
    color:#ccc;
}

.shop-title{
    margin:30px 0 15px;
    color:#ffd700;
}

.shop{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:16px;
}

.card{
    background:#151515;
    border:1px solid #333;
    border-radius:16px;
    overflow:hidden;
}

.card img{
    width:100%;
    height:150px;
    object-fit:cover;
    background:#222;
    display:block;
}

.card-content{
    padding:14px;
}

.card h3{
    margin-bottom:7px;
}

.price{
    color:#5cff7a;
    font-weight:bold;
    margin-bottom:12px;
}

.qty-buttons{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:5px;
    margin-bottom:9px;
}

.qty-buttons button{
    padding:8px 2px;
    border:1px solid #555;
    border-radius:7px;
    background:#222;
    color:white;
    font-size:12px;
}

.qty-buttons button.active{
    background:#ffd700;
    color:#000;
    border-color:#ffd700;
    font-weight:bold;
}

.buy{
    width:100%;
    padding:12px;
    border:none;
    border-radius:9px;
    background:#00c853;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.buy:active{
    transform:scale(.97);
}

.selected{
    font-size:13px;
    color:#aaa;
    margin-bottom:8px;
}

.reset{
    margin:30px 0;
    padding:13px 20px;
    background:#d32f2f;
    border:none;
    color:white;
    border-radius:10px;
    font-weight:bold;
}

.message{
    position:fixed;
    left:50%;
    bottom:20px;
    transform:translateX(-50%);
    background:#222;
    border:1px solid #555;
    padding:13px 18px;
    border-radius:12px;
    display:none;
    z-index:999;
}

@media(max-width:500px){
    header h1{
        font-size:23px;
    }

    .balance{
        font-size:23px;
    }

    .shop{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<header>
    <h1>👑 YOUSAF SULTAN</h1>
    <p>Billionaire Spending Simulator</p>
</header>

<div class="container">

    <div class="search">
        <input
            type="text"
            id="search"
            placeholder="🔎 Search billionaire..."
            oninput="searchPeople()"
        >
    </div>

    <h2 class="section-title">💰 Choose Your Billionaire</h2>

    <div class="billionaires" id="people"></div>

    <section id="fortune">
        <div class="fortune-box">
            <h2 id="selectedName">Select a billionaire first</h2>

            <div class="balance" id="balance">
                $0
            </div>

            <div class="progress-bg">
                <div class="progress" id="progress"></div>
            </div>

            <p id="spentText">Spent: $0</p>

            <h3 style="margin-top:20px;">🧾 Purchase History</h3>
            <div class="history" id="history">
                <div>No purchases yet.</div>
            </div>
        </div>
    </section>

    <h2 class="shop-title">🛍️ Luxury Shop</h2>

    <div class="shop" id="shop"></div>

    <button class="reset" onclick="resetGame()">🔄 Reset Game</button>

</div>

<div class="message" id="message"></div>

<script>

const people = [

["Elon Musk",922900000000],
["Jeff Bezos",368100000000],
["Larry Page",263700000000],
["Sergey Brin",242700000000],
["Michael Dell",237200000000],
["Mark Zuckerberg",220700000000],
["Jensen Huang",182900000000],
["Larry Ellison",166100000000],
["Steve Ballmer",162300000000],
["Warren Buffett",154000000000],
["Amancio Ortega",146700000000],
["Rob Walton",143100000000],
["Jim Walton",139900000000],
["Alice Walton",129400000000],
["Carlos Slim Helu",123400000000],
["Bill Gates",119000000000],
["Bernard Arnault",116600000000],
["Changpeng Zhao",114600000000],
["Francoise Bettencourt Meyers",103100000000],
["Michael Bloomberg",94900000000]

];

const items = [

["Ferrari SF90",550000,"https://loremflickr.com/800/500/ferrari,sf90?lock=1"],
["Bugatti Chiron",3000000,"https://loremflickr.com/800/500/bugatti,chiron?lock=2"],
["Lamborghini Revuelto",600000,"https://loremflickr.com/800/500/lamborghini,revuelto?lock=3"],
["Koenigsegg Jesko",3000000,"https://loremflickr.com/800/500/koenigsegg,jesko?lock=4"],
["Pagani Huayra",3500000,"https://loremflickr.com/800/500/pagani,huayra?lock=5"],
["McLaren P1",2000000,"https://loremflickr.com/800/500/mclaren,p1?lock=6"],
["Aston Martin Valkyrie",3000000,"https://loremflickr.com/800/500/astonmartin,valkyrie?lock=7"],
["Porsche 918 Spyder",1500000,"https://loremflickr.com/800/500/porsche,918?lock=8"],
["Rimac Nevera",2500000,"https://loremflickr.com/800/500/rimac,nevera?lock=9"],
["Mercedes-AMG ONE",2700000,"https://loremflickr.com/800/500/mercedes,amg?lock=10"],

["Mega Mansion",100000000,"https://loremflickr.com/800/500/luxury,mansion?lock=11"],
["Private Jet",80000000,"https://loremflickr.com/800/500/private,jet?lock=12"],
["Super Yacht",600000000,"https://loremflickr.com/800/500/luxury,yacht?lock=13"],
["Private Island",300000000,"https://loremflickr.com/800/500/private,island?lock=14"],
["Company",10000000000,"https://loremflickr.com/800/500/skyscraper,office?lock=15"],
["Skyscraper",2000000000,"https://loremflickr.com/800/500/skyscraper?lock=16"],
["Space Company",50000000000,"https://loremflickr.com/800/500/rocket,space?lock=17"],
["Mega Tech Company",100000000000,"https://loremflickr.com/800/500/technology,company?lock=18"]

];

let selectedPerson = null;
let money = 0;
let startingMoney = 0;
let spent = 0;
let history = [];

/*
IMPORTANT:
selectedQty stores the quantity chosen for every item.
It is NOT reset after buying.
*/
let selectedQty = {};
let maxMode = {};

function formatMoney(value){

    if(value >= 1000000000000)
        return "$" + (value/1000000000000).toFixed(2) + "T";

    if(value >= 1000000000)
        return "$" + (value/1000000000).toFixed(2) + "B";

    if(value >= 1000000)
        return "$" + (value/1000000).toFixed(2) + "M";

    if(value >= 1000)
        return "$" + (value/1000).toFixed(1) + "K";

    return "$" + Math.floor(value).toLocaleString();
}

function renderPeople(){

    const box = document.getElementById("people");

    box.innerHTML = "";

    people.forEach((p,index)=>{

        const div = document.createElement("div");

        div.className = "person";

        div.innerHTML = `
            <h3>${index+1}. ${p[0]}</h3>
            <div class="money">${formatMoney(p[1])}</div>
        `;

        div.onclick = ()=>selectPerson(index);

        box.appendChild(div);

    });
}

function searchPeople(){

    const text =
        document.getElementById("search").value.toLowerCase();

    document.querySelectorAll(".person").forEach(card=>{

        card.style.display =
            card.innerText.toLowerCase().includes(text)
            ? "block"
            : "none";

    });
}

function selectPerson(index){

    selectedPerson = people[index];

    startingMoney = selectedPerson[1];
    money = startingMoney;
    spent = 0;
    history = [];

    selectedQty = {};
    maxMode = {};

    document.getElementById("selectedName").innerText =
        "👑 " + selectedPerson[0];

    updateStats();
    showShop();

    document.getElementById("fortune").scrollIntoView({
        behavior:"smooth",
        block:"start"
    });

    showMessage(selectedPerson[0] + " selected!");
}

function updateStats(){

    document.getElementById("balance").innerText =
        formatMoney(money);

    document.getElementById("spentText").innerText =
        "Spent: " + formatMoney(spent);

    let percent = 0;

    if(startingMoney > 0){
        percent = (spent / startingMoney) * 100;
    }

    document.getElementById("progress").style.width =
        Math.min(percent,100) + "%";

    const historyBox =
        document.getElementById("history");

    if(history.length === 0){

        historyBox.innerHTML =
            "<div>No purchases yet.</div>";

    }else{

        historyBox.innerHTML =
            history.slice().reverse().map(x=>
                `<div>${x}</div>`
            ).join("");

    }
}

function showShop(){

    const shop = document.getElementById("shop");

    shop.innerHTML = "";

    items.forEach((item,i)=>{

        if(selectedQty[i] === undefined)
            selectedQty[i] = 1;

        if(maxMode[i] === undefined)
            maxMode[i] = false;

        const card = document.createElement("div");

        card.className = "card";

        card.innerHTML = `

            <img
                src="${item[2]}"
                alt="${item[0]}"
                loading="lazy"
                onerror="this.style.display='none'"
            >

            <div class="card-content">

                <h3>${item[0]}</h3>

                <div class="price">
                    ${formatMoney(item[1])}
                </div>

                <div class="selected" id="selected-${i}">
                    Selected: ×${selectedQty[i]}
                </div>

                <div class="qty-buttons">

                    <button
                        id="q1-${i}"
                        onclick="setQty(${i},1)"
                    >×1</button>

                    <button
                        id="q2-${i}"
                        onclick="setQty(${i},2)"
                    >×2</button>

                    <button
                        id="q10-${i}"
                        onclick="setQty(${i},10)"
                    >×10</button>

                    <button
                        id="q100-${i}"
                        onclick="setQty(${i},100)"
                    >×100</button>

                    <button
                        id="qmax-${i}"
                        onclick="setMaxMode(${i})"
                    >MAX</button>

                </div>

                <button
                    class="buy"
                    onclick="buy(${i})"
                >
                    🛒 BUY
                </button>

            </div>
        `;

        shop.appendChild(card);

        updateQuantityUI(i);

    });

}

function updateQuantityUI(i){

    const selected =
        document.getElementById("selected-"+i);

    if(!selected) return;

    if(maxMode[i]){

        selected.innerText = "Selected: MAX";

    }else{

        selected.innerText =
            "Selected: ×" + selectedQty[i];

    }

    document
        .querySelectorAll(`[id^="q"][id$="-${i}"]`)
        .forEach(btn=>btn.classList.remove("active"));

    if(maxMode[i]){

        const btn =
            document.getElementById("qmax-"+i);

        if(btn) btn.classList.add("active");

    }else{

        const btn =
            document.getElementById("q"+selectedQty[i]+"-"+i);

        if(btn) btn.classList.add("active");

    }
}

function setQty(i,q){

    selectedQty[i] = q;
    maxMode[i] = false;

    updateQuantityUI(i);

    showMessage("Quantity selected: ×" + q);
}

function setMaxMode(i){

    maxMode[i] = true;

    updateQuantityUI(i);

    showMessage("MAX selected");
}

function buy(i){

    if(!selectedPerson){

        showMessage("First select a billionaire!");

        return;
    }

    const price = items[i][1];

    let quantity;

    /*
    MAX is recalculated every time BUY is pressed.
    So MAX keeps working after every purchase.
    */

    if(maxMode[i]){

        quantity = Math.floor(money / price);

        if(quantity < 1){

            showMessage("Not enough money!");

            return;
        }

    }else{

        quantity = selectedQty[i];

    }

    const total = price * quantity;

    /*
    Fixed quantities such as ×100 remain selected.
    BUY again = another ×100.
    */

    if(money < total){

        showMessage(
            "Not enough money for ×" +
            quantity +
            " " +
            items[i][0]
        );

        return;
    }

    money -= total;
    spent += total;

    history.push(
        "Bought ×" +
        quantity +
        " " +
        items[i][0] +
        " for " +
        formatMoney(total)
    );

    updateStats();

    if(maxMode[i]){

        showMessage(
            "Bought ×" +
            quantity +
            " " +
            items[i][0]
        );

    }else{

        showMessage(
            "Bought ×" +
            quantity +
            " " +
            items[i][0] +
            " — BUY again for another ×" +
            quantity
        );

    }

}

function resetGame(){

    if(!selectedPerson){

        showMessage("Select a billionaire first!");

        return;
    }

    money = startingMoney;
    spent = 0;
    history = [];

    selectedQty = {};
    maxMode = {};

    updateStats();
    showShop();

    showMessage("Game reset!");
}

function showMessage(text){

    const msg =
        document.getElementById("message");

    msg.innerText = text;
    msg.style.display = "block";

    clearTimeout(window.msgTimer);

    window.msgTimer =
        setTimeout(()=>{
            msg.style.display = "none";
        },2500);
}

renderPeople();

</script>

</body>
  </html>
